apiVersion: v1
kind: Service
metadata:
  name: acme-dns
  namespace: ${ACMEDNS_NAMESPACE}
  labels:
    app: acme-dns
spec:
  type: ClusterIP
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
  - name: api
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: acme-dns

