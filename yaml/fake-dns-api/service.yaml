apiVersion: v1
kind: Service
metadata:
  name: fake-dns-api
  namespace: ${FAKEDNS_NAMESPACE}
  labels:
    app: fake-dns-api
spec:
  type: ClusterIP
  ports:
  - name: dns
    port: 53
    targetPort: 53
    protocol: UDP
  - name: health
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: fake-dns-api

