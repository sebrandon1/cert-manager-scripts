# Fake DNS API: Deployment
#
# Runs the fake DNS API server on UBI9 Python. Accepts RFC2136 DNS updates and
# responds to SOA/TXT queries for air-gapped cert-manager DNS-01 testing.
# Listens on unprivileged port 5353; the Service maps external port 53 to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-dns-api
  namespace: ${FAKEDNS_NAMESPACE}
  labels:
    app: fake-dns-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-dns-api
  template:
    metadata:
      labels:
        app: fake-dns-api
    spec:
      serviceAccountName: fake-dns-api
      containers:
      - name: dns-api
        image: registry.access.redhat.com/ubi9/python-39:9.8
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /app/dns-api.py
        ports:
        - name: dns
          containerPort: 5353
          protocol: UDP
        - name: health
          containerPort: 8080
          protocol: TCP
        env:
        - name: DNS_PORT
          value: "5353"
        volumeMounts:
        - name: script
          mountPath: /app
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: script
        configMap:
          name: fake-dns-api
          defaultMode: 0755

