# Pebble ClusterIssuer: DNS-01 RFC2136
#
# ClusterIssuer for DNS-01 challenges using RFC2136 dynamic DNS updates.
# Works with the fake DNS API server for air-gapped testing where Pebble's
# ALWAYS_VALID mode auto-validates challenges regardless of actual DNS state.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${ISSUER_NAME}
spec:
  acme:
    # Pebble ACME server URL
    server: ${ACME_SERVER_URL}
    
    # Skip TLS verification (Pebble uses self-signed certificates)
    skipTLSVerify: true
    
    # Email for ACME account
    email: ${ACME_EMAIL}
    
    # Secret to store ACME account private key
    privateKeySecretRef:
      name: ${ISSUER_NAME}-account-key
    
    # DNS-01 challenge solver
    # With PEBBLE_ALWAYS_VALID=1, Pebble will auto-validate
    # cert-manager will try to update DNS (and fail), but Pebble doesn't care
    solvers:
    - dns01:
        rfc2136:
          nameserver: ${DNS_SERVER}
          tsigKeyName: dummy-key
          tsigAlgorithm: HMACSHA256
          tsigSecretSecretRef:
            name: rfc2136-credentials
            key: tsig-secret
            # For ClusterIssuer, secret must be in cert-manager namespace
            namespace: cert-manager

