# Pebble ClusterIssuer: HTTP-01
#
# ClusterIssuer configured for HTTP-01 ACME challenges using Pebble as the CA.
# Skips TLS verification for Pebble's self-signed certificates and uses
# ingress-based challenge solving.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ${ISSUER_NAME}
spec:
  acme:
    # Pebble ACME server URL
    server: ${ACME_SERVER_URL}
    
    # Skip TLS verification (Pebble uses self-signed certificates)
    skipTLSVerify: true
    
    # Disable HTTP-01 self-check (useful when domains don't resolve)
    disableAccountKeyGeneration: false
    
    # Email for ACME account (can be fake for Pebble)
    email: ${ACME_EMAIL}
    
    # Secret to store ACME account private key
    privateKeySecretRef:
      name: ${ISSUER_NAME}-account-key
    
    # HTTP-01 challenge solver
    solvers:
    - http01:
        ingress:
          class: ${INGRESS_CLASS}
          podTemplate:
            metadata:
              annotations:
                # Tell cert-manager to skip self-check
                acme.cert-manager.io/http01-override-ingress-dns-name: "true"

