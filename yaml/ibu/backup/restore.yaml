apiVersion: velero.io/v1
kind: Restore
metadata:
  name: ${RESTORE_NAME}
  namespace: openshift-adp
  labels:
    app: ibu-cert-test
spec:
  backupName: ${BACKUP_NAME}
  includedNamespaces:
    - ${TARGET_NAMESPACE}
  includedResources:
    - certificates.cert-manager.io
    - secrets
    - configmaps
  # Note: CertificateRequests are excluded - cert-manager creates new ones
  restorePVs: false
