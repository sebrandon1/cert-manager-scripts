# Scenario 1: Default IBU Restore (No Preservation)
#
# Restores the Certificate CR but the TLS secret data is not preserved.
# After restore, cert-manager detects the missing/invalid secret and
# immediately triggers certificate reissuance with new keys.
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: ${RESTORE_NAME}
  namespace: openshift-adp
  labels:
    app: ibu-cert-test
spec:
  backupName: ${BACKUP_NAME}
  includedNamespaces:
    - ${TARGET_NAMESPACE}
  includedResources:
    - certificates.cert-manager.io  # Restored (was in backup)
    - secrets                       # TLS secrets not restored (weren't backed up)
    - configmaps                    # App configmaps if present
  # Note: CertificateRequests are excluded - cert-manager creates new ones
  restorePVs: false
