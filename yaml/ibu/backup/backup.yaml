# Scenario 1: Default IBU Backup (No Preservation)
#
# This mimics what LCA does by default. The labelSelector requires an 'app'
# label, which cert-manager-generated TLS secrets don't have. So while
# 'secrets' is listed in includedResources, the TLS secrets are effectively
# excluded by the selector. The Certificate CR gets backed up, but not the
# TLS secret. After restore, cert-manager sees no valid TLS secret and
# immediately reissues with new keys.
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: ${BACKUP_NAME}
  namespace: openshift-adp
  labels:
    app: ibu-cert-test
spec:
  includedNamespaces:
    - ${TARGET_NAMESPACE}
  includedResources:
    - certificates.cert-manager.io  # Backed up (has app label)
    - secrets                       # TLS secrets excluded (no app label)
    - configmaps                    # App configmaps if present
  # Note: CertificateRequests are excluded because they are transient
  # and cert-manager will create new ones when reconciling certificates
  labelSelector:
    matchExpressions:
      - key: app
        operator: Exists
  storageLocation: velero-1
  ttl: 720h0m0s
