# OADP: OperatorGroup
#
# Creates the OperatorGroup required for OADP operator installation.
# Scopes the operator to the openshift-adp namespace.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-adp
  namespace: openshift-adp
spec:
  targetNamespaces:
    - openshift-adp
