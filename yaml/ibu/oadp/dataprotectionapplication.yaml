# OADP: DataProtectionApplication
#
# Configures Velero with AWS and OpenShift plugins pointing to MinIO for
# S3-compatible backup storage. Enables Kopia-based node agent for file-level
# backups and sets a 10-minute resource timeout for operations.
#
# The csi plugin is deliberately omitted: the IBU tests back up only
# certificates, secrets, and configmaps (no volumes), and with csi enabled
# every backup lists VolumeSnapshots, which ends PartiallyFailed on clusters
# without the snapshot.storage.k8s.io CRDs (e.g. CRC).
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: velero
  namespace: openshift-adp
spec:
  configuration:
    velero:
      defaultPlugins:
        - openshift
        - aws
      resourceTimeout: 10m
    nodeAgent:
      enable: true
      uploaderType: kopia
  backupLocations:
    - velero:
        provider: aws
        default: true
        objectStorage:
          bucket: velero
          prefix: ibu-test
        config:
          region: minio
          s3ForcePathStyle: "true"
          s3Url: http://minio.minio.svc.cluster.local:9000
          insecureSkipTLSVerify: "true"
        credential:
          key: cloud
          name: cloud-credentials
  snapshotLocations:
    - velero:
        provider: aws
        config:
          region: minio
