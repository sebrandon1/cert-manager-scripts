# MinIO: Persistent Volume Claim
#
# Requests 10Gi of persistent storage for MinIO's data directory. Stores
# Velero backups including Kubernetes resources and certificate secrets.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-storage
  namespace: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
