# MinIO: Service
#
# Exposes MinIO's S3-compatible API (port 9000) and web console (port 9001).
# OADP/Velero connects to port 9000 for backup storage operations.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
  selector:
    app: minio
