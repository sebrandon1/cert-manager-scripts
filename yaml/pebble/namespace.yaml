# Pebble: Namespace
#
# Creates the namespace for Pebble, Let's Encrypt's small ACME test server.
# Used for local certificate testing without rate limits or internet access.
apiVersion: v1
kind: Namespace
metadata:
  name: ${PEBBLE_NAMESPACE}
  labels:
    name: ${PEBBLE_NAMESPACE}
    app: pebble

