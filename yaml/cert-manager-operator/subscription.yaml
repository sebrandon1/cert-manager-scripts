# Cert-Manager Operator: Subscription
#
# Subscribes to the openshift-cert-manager-operator from Red Hat's operator
# catalog. Uses a specific startingCSV and manual approval so OLM does not
# automatically upgrade to a newer version while the install is being verified.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ${OPERATOR_NAME}
  namespace: ${OPERATOR_NAMESPACE}
spec:
  channel: ${CHANNEL}
  installPlanApproval: Manual
  name: openshift-cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: cert-manager-operator.${CERT_MANAGER_VERSION}
