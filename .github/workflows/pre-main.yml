name: Pre-Main Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SHELL: /bin/bash
  KUBECONFIG: '/home/runner/.crc/machines/crc/kubeconfig'

jobs:
  shell-format-check:
    name: Shell Script Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Shfmt
        run: shfmt -d .

  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          echo "Running ShellCheck on all shell scripts..."
          find scripts/ -type f -name "*.sh" -print0 | xargs -0 shellcheck --severity=error --shell=bash

  workload-partitioning-check:
    name: Validate Workload Partitioning Check Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify workload partitioning check script exists
        run: ./scripts/workflows/verify-workload-partitioning-script-exists.sh

      - name: Verify script is executable
        run: ./scripts/workflows/verify-script-executable.sh

      - name: Check script syntax
        run: |
          bash -n scripts/troubleshooting/check-workload-partitioning.sh
          echo "✅ Script syntax is valid"

      - name: Verify Makefile target exists
        run: ./scripts/workflows/verify-makefile-target.sh

      - name: Verify documentation mentions workload partitioning
        run: ./scripts/workflows/verify-documentation.sh

  verify-structure:
    name: Verify Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify directory structure
        run: ./scripts/workflows/verify-directory-structure.sh

      - name: Verify key files exist
        run: ./scripts/workflows/verify-key-files.sh

  integration-test:
    name: Integration Test (OCP 4.19)
    runs-on: ubuntu-latest
    needs: [shell-format-check, shellcheck, workload-partitioning-check, verify-structure]
    # Skip integration tests for Dependabot PRs (no access to secrets)
    if: |
      github.actor != 'dependabot[bot]' &&
      needs.shell-format-check.result == 'success' &&
      needs.shellcheck.result == 'success' &&
      needs.workload-partitioning-check.result == 'success' &&
      needs.verify-structure.result == 'success'
    steps:
      - name: Check if CRC_PULL_SECRET exists
        env:
          super_secret: ${{ secrets.CRC_PULL_SECRET }}
        if: ${{ env.super_secret == '' }}
        run: |
          echo "CRC_PULL_SECRET is not set"
          exit 1

      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Deploy the OCP Cluster
        uses: palmsoftware/quick-ocp@v0.0.24
        with:
          ocpPullSecret: $OCP_PULL_SECRET
          bundleCache: true
          desiredOCPVersion: 4.19
          waitForOperatorsReady: true
        env:
          OCP_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}

      - name: Verify cluster access
        run: ./scripts/workflows/verify-cluster-access.sh

      - name: Run quick HTTP-01 test
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          command: make quick-http-test

      - name: Verify workload partitioning configuration
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: make check-workload-partitioning

      - name: Display component status
        if: always()
        run: ./scripts/workflows/display-component-status.sh

