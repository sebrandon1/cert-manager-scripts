name: Pre-Main Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-format-check:
    name: Shell Script Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1

      - name: Shfmt
        run: shfmt -d scripts/ lib/

  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          echo "Running ShellCheck on all shell scripts..."
          find scripts/ lib/ -type f -name "*.sh" -print0 | xargs -0 shellcheck --severity=error --shell=bash

  workload-partitioning-check:
    name: Validate Workload Partitioning Check Script
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify workload partitioning check script exists
        run: ./scripts/workflows/verify-workload-partitioning-script-exists.sh

      - name: Verify script is executable
        run: ./scripts/workflows/verify-script-executable.sh

      - name: Check script syntax
        run: |
          bash -n scripts/troubleshooting/check-workload-partitioning.sh
          echo "✅ Script syntax is valid"

      - name: Verify Makefile target exists
        run: ./scripts/workflows/verify-makefile-target.sh

      - name: Verify documentation mentions workload partitioning
        run: ./scripts/workflows/verify-documentation.sh

  verify-structure:
    name: Verify Repository Structure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify directory structure
        run: ./scripts/workflows/verify-directory-structure.sh

      - name: Verify key files exist
        run: ./scripts/workflows/verify-key-files.sh

      - name: Verify script references
        run: ./scripts/workflows/verify-script-references.sh

  version-query-check:
    name: Verify Version Query Scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run all version query scripts
        run: |
          failed=0
          for script in scripts/workflows/query-*-version.sh; do
            name=$(basename "$script")
            echo "--- $name ---"
            if GITHUB_OUTPUT=/dev/null bash "$script"; then
              echo "PASS: $name"
            else
              echo "FAIL: $name"
              failed=$((failed + 1))
            fi
            echo ""
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed version query script(s) failed"
            exit 1
          fi

  integration-test:
    name: Integration Test (OCP ${{ matrix.ocp-version }})
    needs: [shell-format-check, shellcheck, workload-partitioning-check, verify-structure]
    if: |
      github.actor != 'dependabot[bot]' &&
      needs.shell-format-check.result == 'success' &&
      needs.shellcheck.result == 'success' &&
      needs.workload-partitioning-check.result == 'success' &&
      needs.verify-structure.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        ocp-version: ['4.20', '4.21']
    uses: ./.github/workflows/reusable-integration-test.yml
    with:
      ocp-version: ${{ matrix.ocp-version }}
      cert-manager-version: v1.19.0
      checkout-ref: ${{ github.sha }}
    secrets:
      CRC_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}

