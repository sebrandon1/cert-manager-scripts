name: Nightly Integration Tests

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      cert-manager-version:
        description: 'Cert-manager operator version (leave empty for full matrix)'
        required: false
        type: string
      ocp-version:
        description: 'OCP version (leave empty for full matrix)'
        required: false
        type: string
      run-ibu:
        description: 'Run dedicated IBU Scenario 1 smoke job'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  setup:
    name: Build test matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Determine matrix
        id: set-matrix
        env:
          CERT_MANAGER_INPUT: ${{ inputs.cert-manager-version }}
          OCP_INPUT: ${{ inputs.ocp-version }}
        run: |
          cm_versions=$(jq -cn --arg input "$CERT_MANAGER_INPUT" \
            'if $input == "" then ["v1.18.1", "v1.19.0", "v1.20.0"] else [$input] end')
          ocp_versions=$(jq -cn --arg input "$OCP_INPUT" \
            'if $input == "" then ["4.20", "4.21", "4.22"] else [$input] end')

          # OCP 4.22 does not publish the cert-manager v1.18.1 bundle. Keep
          # that unsupported pair out of default/partial-selection matrices,
          # but preserve an explicitly requested pair so the installer reports
          # the missing bundle clearly.
          matrix=$(jq -cn \
            --argjson cm_versions "$cm_versions" \
            --argjson ocp_versions "$ocp_versions" \
            --arg cm_input "$CERT_MANAGER_INPUT" \
            --arg ocp_input "$OCP_INPUT" \
            '{include: [
              $ocp_versions[] as $ocp |
              $cm_versions[] as $cm |
              select(($ocp != "4.22" or $cm != "v1.18.1") or ($cm_input != "" and $ocp_input != "")) |
              {"cert-manager-version": $cm, "ocp-version": $ocp}
            ]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  lint:
    name: Quick lint gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: "3.14.0"

      - name: Shfmt
        run: shfmt -d .

      - name: Run ShellCheck
        run: find scripts/ -type f -name "*.sh" -print0 | xargs -0 shellcheck --severity=error --shell=bash

  integration-test:
    name: Test cert-manager ${{ matrix.cert-manager-version }} on OCP ${{ matrix.ocp-version }}
    needs: [setup, lint]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/reusable-integration-test.yml
    with:
      ocp-version: ${{ matrix.ocp-version }}
      cert-manager-version: ${{ matrix.cert-manager-version }}
    secrets:
      CRC_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}

  ibu-smoke:
    name: IBU Scenario 1 smoke
    needs: [lint]
    if: ${{ github.event_name == 'schedule' || inputs.run-ibu }}
    uses: ./.github/workflows/reusable-integration-test.yml
    with:
      ocp-version: '4.21'
      cert-manager-version: 'v1.20.0'
      run-ibu: true
    secrets:
      CRC_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}
