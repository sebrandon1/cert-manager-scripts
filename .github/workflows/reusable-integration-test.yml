name: Reusable Integration Test

on:
  workflow_call:
    inputs:
      ocp-version:
        required: true
        type: string
      cert-manager-version:
        required: false
        type: string
        default: ''
      checkout-ref:
        required: false
        type: string
        default: ''
      run-ibu:
        description: 'Run IBU Scenario 1 smoke (MinIO + OADP backup/restore)'
        required: false
        type: boolean
        default: false
    secrets:
      CRC_PULL_SECRET:
        required: true

env:
  SHELL: /bin/bash
  KUBECONFIG: '/home/runner/.crc/machines/crc/kubeconfig'
  SKIP_CONFIRM: '1'

jobs:
  olm-precheck:
    name: OLM precheck (OCP ${{ inputs.ocp-version }} / cert-manager ${{ inputs.cert-manager-version || 'default' }})
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Check operator bundle availability in OLM
        id: check
        env:
          OCP_VERSION: ${{ inputs.ocp-version }}
          CERT_MANAGER_VERSION: ${{ inputs.cert-manager-version }}
        run: ./scripts/workflows/check-olm-operator-bundle.sh

  test:
    name: OCP ${{ inputs.ocp-version }} / cert-manager ${{ inputs.cert-manager-version || 'default' }}
    needs: [olm-precheck]
    if: ${{ needs.olm-precheck.outputs.available == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check Red Hat Status
        uses: palmsoftware/redhat-status@v0
        with:
          components: |
            api.openshift.com
            developers.redhat.com

      - name: Check if CRC_PULL_SECRET exists
        env:
          super_secret: ${{ secrets.CRC_PULL_SECRET }}
        if: ${{ env.super_secret == '' }}
        run: |
          echo "CRC_PULL_SECRET is not set"
          exit 1

      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Deploy the OCP Cluster
        uses: palmsoftware/quick-ocp@v1.0.5
        with:
          ocpPullSecret: ${{ secrets.CRC_PULL_SECRET }}
          bundleCache: true
          desiredOCPVersion: ${{ inputs.ocp-version }}
          waitForOperatorsReady: true

      - name: Wait for cluster operators to stabilize
        run: ./scripts/workflows/wait-for-cluster-operators.sh

      - name: Full cluster health check
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 10
          retry_on: error
          retry_wait_seconds: 15
          command: ./scripts/workflows/verify-cluster-access.sh

      - name: Install cert-manager Operator and wait for readiness
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_on: error
          on_retry_command: |
            echo "=== OLM diagnostics ==="
            oc get catalogsource -n openshift-marketplace 2>/dev/null || true
            oc get subscription -n openshift-operators 2>/dev/null || true
            oc get csv -n openshift-operators 2>/dev/null || true
            oc get events -n openshift-operators --sort-by='.lastTimestamp' 2>/dev/null | tail -20 || true
            echo "=== cert-manager namespace diagnostics ==="
            oc get pods -n cert-manager 2>/dev/null || true
            echo "=== Attempting cluster recovery ==="
            ./scripts/workflows/recover-cluster.sh || echo "Recovery attempt failed, retrying install anyway"
            sleep 30
          command: make install-cert-manager-operator
        env:
          CERT_MANAGER_VERSION: ${{ inputs.cert-manager-version }}

      - name: Run quick HTTP-01 test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          on_retry_command: |
            echo "=== Pebble diagnostics ==="
            oc get pods -n pebble -o wide 2>/dev/null || true
            oc get events -n pebble --sort-by='.lastTimestamp' 2>/dev/null | tail -15 || true
            echo "=== cert-manager diagnostics ==="
            oc get pods -n cert-manager 2>/dev/null || true
          command: make QUICK_HTTP_SKIP_INSTALL=true quick-http-test
        env:
          CERT_MANAGER_VERSION: ${{ inputs.cert-manager-version }}

      - name: Clean up HTTP-01 test resources
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: make clean-certs clean-issuers || true

      - name: Run quick self-signed CA test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          on_retry_command: |
            echo "=== cert-manager diagnostics ==="
            oc get pods -n cert-manager 2>/dev/null || true
            oc get events -n cert-manager --sort-by='.lastTimestamp' 2>/dev/null | tail -10 || true
          command: make quick-selfsigned-test

      - name: Clean up self-signed test resources
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: make clean-selfsigned || true

      - name: Verify Pebble health before DNS-01 test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 6
          retry_wait_seconds: 15
          retry_on: error
          on_retry_command: |
            echo "=== Pebble not ready, diagnosing ==="
            oc get pods -n pebble -o wide 2>/dev/null || true
            oc get events -n pebble --sort-by='.lastTimestamp' 2>/dev/null | tail -10 || true
            echo "=== Cluster health check ==="
            ./scripts/workflows/verify-cluster-access.sh || true
          command: |
            REPLICAS=$(oc get deployment pebble -n pebble \
              -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo "0")
            if ! echo "$REPLICAS" | grep -qE '^[1-9]'; then
              echo "ERROR: Pebble not healthy (availableReplicas=${REPLICAS:-0})"
              exit 1
            fi
            echo "Pebble is healthy (availableReplicas=$REPLICAS)"

      - name: Run quick DNS-01 test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_on: error
          on_retry_command: |
            echo "=== Pebble diagnostics ==="
            oc get pods -n pebble -o wide 2>/dev/null || true
            oc get events -n pebble --sort-by='.lastTimestamp' 2>/dev/null | tail -15 || true
            echo "=== fake-dns diagnostics ==="
            oc get pods -n fake-dns -o wide 2>/dev/null || true
          command: make quick-dns-test

      - name: Clean up DNS-01 test resources
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: make clean-certs clean-issuers clean-pebble clean-fake-dns || true

      - name: Run multi-algorithm certificate test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          command: make quick-multi-algo-test

      - name: Verify workload partitioning configuration
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: make check-workload-partitioning

      - name: Check network stack configuration
        run: make check-network-stack

      - name: Verify cluster connection before API server cert test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: ./scripts/workflows/verify-cluster-access.sh

      - name: Recreate issuer for API server cert test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          on_retry_command: |
            echo "=== Pebble diagnostics ==="
            oc get pods -n pebble -o wide 2>/dev/null || true
            oc get events -n pebble --sort-by='.lastTimestamp' 2>/dev/null | tail -15 || true
            echo "=== cert-manager webhook status ==="
            oc get deployment cert-manager-webhook -n cert-manager 2>/dev/null || true
            echo "=== Existing ClusterIssuers ==="
            oc get clusterissuer 2>/dev/null || true
            echo "=== Attempting cluster recovery ==="
            ./scripts/workflows/recover-cluster.sh || echo "Recovery failed"
            sleep 15
          command: make install-pebble create-issuer
        env:
          PEBBLE_ALWAYS_VALID: "1"

      - name: Create API server certificate
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          on_retry_command: |
            echo "Certificate creation failed, attempting cluster recovery..."
            ./scripts/workflows/recover-cluster.sh || echo "Recovery attempt failed"
            sleep 5
          command: make create-apiserver-cert

      - name: Verify API server certificate
        continue-on-error: true
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_on: error
          on_retry_command: |
            echo "Verification failed, attempting cluster recovery..."
            ./scripts/workflows/recover-cluster.sh || echo "Recovery attempt failed"
            sleep 10
          command: ./scripts/workflows/verify-apiserver-cert-with-retry.sh

      - name: Install IBU prerequisites
        if: inputs.run-ibu
        timeout-minutes: 30
        run: ./scripts/workflows/install-ibu-prereqs-with-retry.sh

      - name: Run IBU Scenario 1 smoke (cert loss)
        if: inputs.run-ibu
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 50
          max_attempts: 2
          retry_on: error
          on_retry_command: |
            echo "=== IBU test diagnostics ==="
            oc get pods -n cert-manager 2>/dev/null || true
            oc get certificates -A 2>/dev/null || true
            oc get clusterissuer 2>/dev/null || true
            echo "=== Cleaning up partial IBU state before retry ==="
            make clean-ibu || true
            ./scripts/workflows/verify-cluster-access.sh || true
            sleep 30
          command: make test-ibu-certs

      - name: Clean up IBU resources
        if: ${{ always() && inputs.run-ibu }}
        timeout-minutes: 10
        continue-on-error: true
        run: make clean-ibu || true

      - name: Final cluster health check
        if: always()
        run: |
          echo "Running final cluster health check..."
          ./scripts/workflows/verify-cluster-access.sh || echo "Cluster may be unstable"

      - name: Display component status
        if: always()
        run: ./scripts/workflows/display-component-status.sh
