name: Reusable Integration Test

on:
  workflow_call:
    inputs:
      ocp-version:
        required: true
        type: string
      cert-manager-version:
        required: false
        type: string
        default: ''
      checkout-ref:
        required: false
        type: string
        default: ''
    secrets:
      CRC_PULL_SECRET:
        required: true

env:
  SHELL: /bin/bash
  KUBECONFIG: '/home/runner/.crc/machines/crc/kubeconfig'

jobs:
  test:
    name: OCP ${{ inputs.ocp-version }} / cert-manager ${{ inputs.cert-manager-version || 'default' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check Red Hat Status
        uses: palmsoftware/redhat-status@v0
        with:
          components: |
            api.openshift.com
            developers.redhat.com

      - name: Check if CRC_PULL_SECRET exists
        env:
          super_secret: ${{ secrets.CRC_PULL_SECRET }}
        if: ${{ env.super_secret == '' }}
        run: |
          echo "CRC_PULL_SECRET is not set"
          exit 1

      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Deploy the OCP Cluster
        uses: palmsoftware/quick-ocp@v1.0.2
        with:
          ocpPullSecret: $OCP_PULL_SECRET
          bundleCache: true
          desiredOCPVersion: ${{ inputs.ocp-version }}
          waitForOperatorsReady: true
        env:
          OCP_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}

      - name: Wait for cluster operators to stabilize
        run: ./scripts/workflows/wait-for-cluster-operators.sh

      - name: Full cluster health check
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 10
          retry_on: error
          retry_wait_seconds: 15
          command: ./scripts/workflows/verify-cluster-access.sh

      - name: Run quick HTTP-01 test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: error
          on_retry_command: |
            echo "=== Pebble diagnostics ==="
            oc get pods -n pebble -o wide 2>/dev/null || true
            oc get events -n pebble --sort-by='.lastTimestamp' 2>/dev/null | tail -15 || true
            echo "=== cert-manager diagnostics ==="
            oc get pods -n cert-manager 2>/dev/null || true
          command: make quick-http-test
        env:
          CERT_MANAGER_VERSION: ${{ inputs.cert-manager-version }}

      - name: Clean up HTTP-01 test resources
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: make clean-certs clean-issuers || true

      - name: Run quick self-signed CA test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          on_retry_command: |
            echo "=== cert-manager diagnostics ==="
            oc get pods -n cert-manager 2>/dev/null || true
            oc get events -n cert-manager --sort-by='.lastTimestamp' 2>/dev/null | tail -10 || true
          command: make quick-selfsigned-test

      - name: Clean up self-signed test resources
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: make clean-selfsigned || true

      - name: Verify Pebble health before DNS-01 test
        run: |
          echo "Checking Pebble pod status before DNS-01 test..."
          oc get pods -n pebble -o wide 2>/dev/null || true
          oc get events -n pebble --sort-by='.lastTimestamp' 2>/dev/null | tail -10 || true
          if ! oc get deployment pebble -n pebble -o jsonpath='{.status.availableReplicas}' 2>/dev/null | grep -q '^[1-9]'; then
            echo "WARNING: Pebble is not healthy, DNS-01 test may fail"
          else
            echo "Pebble is healthy"
          fi

      - name: Run quick DNS-01 test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_on: error
          on_retry_command: |
            echo "=== Pebble diagnostics ==="
            oc get pods -n pebble -o wide 2>/dev/null || true
            oc get events -n pebble --sort-by='.lastTimestamp' 2>/dev/null | tail -15 || true
            echo "=== fake-dns diagnostics ==="
            oc get pods -n fake-dns -o wide 2>/dev/null || true
          command: make quick-dns-test

      - name: Clean up DNS-01 test resources
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        run: make clean-certs clean-issuers clean-pebble clean-fake-dns || true

      - name: Run multi-algorithm certificate test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          command: make quick-multi-algo-test

      - name: Verify workload partitioning configuration
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: make check-workload-partitioning

      - name: Check network stack configuration
        run: make check-network-stack

      - name: Verify cluster connection before API server cert test
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          command: ./scripts/workflows/verify-cluster-access.sh

      - name: Recreate issuer for API server cert test
        run: |
          PEBBLE_ALWAYS_VALID=1 make install-pebble create-issuer || true

      - name: Create API server certificate
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: error
          on_retry_command: |
            echo "Certificate creation failed, attempting cluster recovery..."
            ./scripts/workflows/recover-cluster.sh || echo "Recovery attempt failed"
            sleep 5
          command: make create-apiserver-cert

      - name: Verify API server certificate
        continue-on-error: true
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_on: error
          on_retry_command: |
            echo "Verification failed, attempting cluster recovery..."
            ./scripts/workflows/recover-cluster.sh || echo "Recovery attempt failed"
            sleep 10
          command: ./scripts/workflows/verify-apiserver-cert-with-retry.sh

      - name: Final cluster health check
        if: always()
        run: |
          echo "Running final cluster health check..."
          ./scripts/workflows/verify-cluster-access.sh || echo "Cluster may be unstable"

      - name: Display component status
        if: always()
        run: ./scripts/workflows/display-component-status.sh
